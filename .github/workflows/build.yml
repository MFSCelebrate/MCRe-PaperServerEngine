name: Build Project

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 给 gradlew 加执行权限
        run: chmod +x ./gradlew

      - name: Apply Patches
        run: |
          git config --global user.email "no-reply@github.com"
          git config --global user.name "GitHub Actions"
          ./gradlew applyPatches --stacktrace

      - name: Build
        run: ./gradlew build --stacktrace

      # ================================================
      # 打包整个构建好的项目（包含所有缓存和构建产物）
      # ================================================
      - name: Package entire build project (with caches)
        run: |
          tar -czf full-build-project.tar.gz \
            --exclude='.git' \
            --exclude='full-build-project.tar.gz' \
            --exclude='.github' \
            --exclude='.gitignore' \
            .
          # 若需要更小体积，可排除 .gradle 目录，但根据要求保留缓存，故不排除

      - name: Upload full build project
        uses: actions/upload-artifact@v4
        with:
          name: full-build-project
          path: full-build-project.tar.gz
