name: Build Project

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 给 gradlew 加执行权限
        run: chmod +x ./gradlew

      - name: Apply Patches
        run: |
          git config --global user.email "no-reply@github.com"
          git config --global user.name "GitHub Actions"
          ./gradlew applyPatches --stacktrace

      - name: Build
        run: ./gradlew build --stacktrace

      # ================================================
      # 停止 Gradle 守护进程，避免后台写文件干扰打包
      # ================================================
      - name: Stop Gradle Daemon
        run: ./gradlew --stop

      # ================================================
      # 打包整个项目（包含所有缓存和构建产物）
      # 使用 zip（对文件变化容忍度高）排除 git 等无关目录
      # ================================================
      - name: Package entire build project
        run: |
          zip -r full-build-project.zip . \
            -x ".git/*" \
            -x ".github/*" \
            -x ".gitignore" \
            -x "full-build-project.zip"

      - name: Upload full build project
        uses: actions/upload-artifact@v4
        with:
          name: full-build-project
          path: full-build-project.zip
